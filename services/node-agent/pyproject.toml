[project]
name = "cvx-agent"
version = "1.0.0"
description = "CVX Node Agent — runs on Linux nodes, bridges the control plane to LXD"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "cryptography>=42.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.scripts]
cvx-agent = "cvx_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cvx_agent*"]
