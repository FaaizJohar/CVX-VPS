services:
  postgres:
    image: postgres:16-alpine
    container_name: cvx-postgres
    environment:
      POSTGRES_USER: cvx
      POSTGRES_PASSWORD: cvx_dev_password
      POSTGRES_DB: cvx
    ports:
      - "5432:5432"
    volumes:
      - cvx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cvx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cvx_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvx_pgdata:
  cvx_redisdata:
